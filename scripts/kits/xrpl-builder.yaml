capabilities:
  - capability_id: xrpl-query
    name: Query XRPL account state
    description: account_info + account_lines + account_objects in one call.
    chains: [xrpl-mainnet, xrpl-testnet]
    stablecoins: []
    eval_task_ids: [query-xrpl]
  - capability_id: xrpl-mpt
    name: Mint / transfer Multi-Purpose Tokens
    description: "Full MPT lifecycle: issue, hold, transfer, destroy."
    chains: [xrpl-mainnet, xrpl-testnet]
    stablecoins: []
    eval_task_ids: [mint-mpt]
  - capability_id: xrpl-xls56-batch
    name: Submit XLS-56 Batch transactions
    description: Multi-step atomic Batch tx once XLS-56 activates on mainnet.
    chains: [xrpl-devnet, xrpl-testnet]
    stablecoins: []
    eval_task_ids: []
  - capability_id: xrpl-xls65-vault
    name: Deposit / withdraw XLS-65 Single Asset Vault
    description: Vault position lifecycle helpers.
    chains: [xrpl-devnet]
    stablecoins: [USDC, RLUSD]
    eval_task_ids: []
  - capability_id: xrpl-xls66-lending
    name: XLS-66 lending protocol helpers
    description: Deposit, borrow, repay against XRPL lending pool.
    chains: [xrpl-devnet]
    stablecoins: [RLUSD]
    eval_task_ids: []
